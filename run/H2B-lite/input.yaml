selection:
   ### use `&`, `|`, `~` for logical operations on numpy arrays
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   label_QCD:   (ak.flatten(evt_label) == 0)
   label_VJets: (ak.flatten(evt_label) == 1)
   label_TTbar: (ak.flatten(evt_label) == 2)
   label_H2B:   (ak.flatten(evt_label) == 3)
   label_2H4B:  (ak.flatten(evt_label) == 4)
   # input vars
   evt_ht_log: np.log(evt_ht)
   evt_met_log: np.log(evt_met)
   jet_pt_log: np.log(jet_pt)
   jet_e_log: np.log(jet_e)
   jet_sdmass_log: np.log(np.maximum(jet_sdmass, 1e-8))
   lep_pt_log: np.log(lep_pt)
   pho_pt_log: np.log(pho_pt)
   # masks
   evt_mask: ak.ones_like(evt_ht)
   jet_mask: ak.ones_like(jet_pt)
   lep_mask: ak.ones_like(lep_pt)
   pho_mask: ak.ones_like(pho_pt)
   # four-vectors
   jet_p4: _p4_from_ptetaphie(jet_pt, jet_eta, jet_phi, jet_e)
   jet_px: jet_p4.px
   jet_py: jet_p4.py
   jet_pz: jet_p4.pz
   lep_p4: _p4_from_ptetaphie(lep_pt, lep_eta, lep_phi, lep_e)
   lep_px: lep_p4.px
   lep_py: lep_p4.py
   lep_pz: lep_p4.pz
   pho_p4: _p4_from_ptetaphie(pho_pt, pho_eta, pho_phi, pho_e)
   pho_px: pho_p4.px
   pho_py: pho_p4.py
   pho_pz: pho_p4.pz
   evt_zeros: np.zeros_like(evt_met)
   evt_met_t_p4: _p4_from_ptetaphie(evt_met, evt_zeros, evt_metphi, evt_met)
   evt_met_t_px: evt_met_t_p4.px
   evt_met_t_py: evt_met_t_p4.py
   evt_met_t_pz: evt_met_t_p4.pz
   # ParT output
   jet_probHbb: out_0
   jet_probQCD: out_161 + out_162 + out_163 + out_164 + out_165 + out_166 + out_167 + out_168 + out_169 + out_170 + out_171 + out_172 + out_173 + out_174 + out_175 + out_176 + out_177 + out_178 + out_179 + out_180 + out_181 + out_182 + out_183 + out_184 + out_185 + out_186 + out_187
   jet_probHbb_log: np.log(np.maximum(jet_probHbb, 1e-8))
   jet_probQCD_log: np.log(np.maximum(jet_probQCD, 1e-8))
   # observers
   lead_jet_pt:      'jet_pt      [...,0]'
   lead_jet_eta:     'jet_eta     [...,0]'
   lead_jet_phi:     'jet_phi     [...,0]'
   lead_jet_e:       'jet_e       [...,0]'
   lead_jet_sdmass:  'jet_sdmass  [...,0]'
   lead_jet_probHbb: 'jet_probHbb [...,0]'
   lead_jet_probQCD: 'jet_probQCD [...,0]'

preprocess:
  ### method: [manual, auto] - whether to use manually specified parameters for variable standardization
  method: manual
  ### data_fraction: fraction of events to use when calculating the mean/scale for the standardization
  data_fraction: 1.0

inputs:
   evt_features:
      length: 2
      pad_mode: wrap
      vars:
      ### [format 1]: var_name (no transformation)
      ### [format 2]: [var_name,
      ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto),
      ###              multiply_by(optional, default=1),
      ###              clip_min(optional, default=-5),
      ###              clip_max(optional, default=5),
      ###              pad_value(optional, default=0)]
         - [evt_ht_log, 7.5, 5]
         - [evt_met_log, 4, 1]
   evt_vectors:
      length: 2
      pad_mode: wrap
      vars:
         - [evt_met_t_px, null]
         - [evt_met_t_py, null]
         - [evt_met_t_pz, null]
         - [evt_met, null]
   evt_mask:
      length: 2
      pad_mode: constant
      vars:
         - evt_mask
   
   jet_features:
      length: 10
      pad_mode: wrap
      vars:
         - [jet_pt_log, 6.5, 2.5]
         - [jet_eta, null]
         - [jet_phi, null]
         - [jet_e_log, 6.5, 2.5]
         - [jet_sdmass_log, 3.5, 2]
         - [jet_probHbb_log, null]  # [TODO] Standardization.
         - [jet_probQCD_log, null]
   jet_vectors:
      length: 10
      pad_mode: wrap
      vars:
         - [jet_px, null]
         - [jet_py, null]
         - [jet_pz, null]
         - [jet_e, null]
   jet_mask:
      length: 10
      pad_mode: constant
      vars:
         - jet_mask

   lep_features:
      length: 5
      pad_mode: wrap
      vars:
         - [lep_pt_log, 4, 1]
         - [lep_eta, null]
         - [lep_phi, null]
         - [lep_pid, null]
         - [lep_iso_db, 0, 5]
         - [lep_iso_rc, 0, 10]
         - [lep_d0, 0, 5]
         - [lep_d0_err, 0, 100]
         - [lep_dz, 0, 0.01]
         - [lep_dz_err, 0, 25]
   lep_vectors:
      length: 5
      pad_mode: wrap
      vars:
         - [lep_px, null]
         - [lep_py, null]
         - [lep_pz, null]
         - [lep_e, null]
   lep_mask:
      length: 5
      pad_mode: constant
      vars:
         - lep_mask

   pho_features:
      length: 5
      pad_mode: wrap
      vars:
         - [pho_pt_log, 4, 1]
         - [pho_eta, null]
         - [pho_phi, null]
         - [pho_iso_db, 0, 5]
         - [pho_iso_rc, 0, 10]
         - [pho_ehoe, null]
         #- [pho_sumpt_c, null]
         #- [pho_sumpt_n, null]
         #- [pho_sumpt_c_pu, null]
         #- [pho_sumpt, null]
         #- [pho_status, null]
   pho_vectors:
      length: 5
      pad_mode: wrap
      vars:
         - [pho_px, null]
         - [pho_py, null]
         - [pho_pz, null]
         - [pho_e, null]
   pho_mask:
      length: 5
      pad_mode: constant
      vars:
         - pho_mask

labels:
   ### type can be `simple`, `custom`
   ### [option 1] use `simple` for binary/multi-class classification, then `value` is a list of 0-1 labels
   type: simple
   value: [label_QCD, label_VJets, label_TTbar, label_H2B]
   ### [option 2] otherwise use `custom` to define the label, then `value` is a map
   #type: custom
   #value:
   #   truth_label: evt_label

observers:
   - evt_label
   - lead_jet_pt
   - lead_jet_eta
   - lead_jet_phi
   - lead_jet_e
   - lead_jet_sdmass
   - lead_jet_probHbb
   - lead_jet_probQCD

weights:
   use_precomputed_weights: false
   reweight_method: flat
   reweight_vars:
      lead_jet_pt: [-10000000000, +10000000000]
      lead_jet_sdmass: [50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 160, 170, 180, 190, 200, 210, 220, 230, 240, 250]
   reweight_classes: [label_QCD, label_VJets, label_TTbar, label_H2B]
   class_weights: [1.0, 1.0, 1.0, 1.0]
   reweight_hists:
